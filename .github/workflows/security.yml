# Secret scanning. Runs on pull requests, pushes to main, and weekly.
#
# Static analysis is not here: CodeQL "default setup" is switched on for this
# repository (Settings → Code security), and GitHub rejects a second CodeQL
# upload from a workflow while it is on. Its "Analyze (javascript-typescript)"
# check is the CodeQL gate.
name: Security

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "0 5 * * 1" # Mondays 05:00 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gitleaks:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # scan full history, not just the last commit
          persist-credentials: false

      # The gitleaks CLI, not gitleaks-action. On a pull request the action
      # scans with --no-merges --first-parent, so it skips commits that reach
      # the PR through a merged branch. This scans every commit in history.
      # The download is pinned to a version and its SHA-256 from the
      # release's checksums file, and the job fails if the hash differs.
      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          curl -sSfL -o gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum --check --strict
          tar -xzf gitleaks.tar.gz gitleaks
          rm gitleaks.tar.gz

      # Reads .gitleaksignore for reviewed false positives.
      - name: Scan full history
        run: ./gitleaks git . --redact --no-banner --verbose
